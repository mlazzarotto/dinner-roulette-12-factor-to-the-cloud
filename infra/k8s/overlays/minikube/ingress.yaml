# Plain HTTP on minikube: no TLS locally.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: dinner
spec:
  ingressClassName: nginx
  rules:
    - host: dinner.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
