# The load balancer belongs to the ingress-nginx Service; `make oke-up` sets its OCI annotations.
# __OCIR_IMAGE__ is filled by `make oke-deploy`, which owns the image reference.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: dinner
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
spec:
  ingressClassName: nginx
  tls:
    - hosts: [alessandroperetti.dev]
      secretName: dinner-tls
  rules:
    - host: alessandroperetti.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
