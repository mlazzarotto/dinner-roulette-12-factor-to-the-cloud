# Postgres is run by the CloudNativePG operator (installed by `make oke-deploy` / `mk-deploy`).
# db/init.sql arrives through the db-init ConfigMap, created by the same targets.
apiVersion: v1
kind: Secret
metadata:
  name: db-app
  namespace: dinner
type: kubernetes.io/basic-auth
stringData:
  username: dinner
  password: dinner
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: db
  namespace: dinner
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  bootstrap:
    initdb:
      database: dinner_roulette
      owner: dinner
      secret:
        name: db-app
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: db-init
            key: init.sql
  storage:
    # No storageClass: use the cluster default (oci-bv on OKE, standard on minikube).
    # OCI rounds this up to its 50 GB block volume minimum.
    size: 1Gi
