# The load balancer belongs to the ingress-nginx Service; `make up` sets its OCI annotations.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: dinner
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
spec:
  ingressClassName: nginx
  tls:
    - hosts: [dinner.lazzarotto.dev]
      secretName: dinner-tls
  rules:
    - host: dinner.lazzarotto.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
