name: release

# Every push to main: release-please opens or updates a release PR from
# conventional commits (feat, fix). Merging that PR creates the GitHub Release.
# The publish job then pushes dinner-roulette:<version> and deploys that tag.
# It has to live in this workflow: the token that creates the release does not
# start the other workflows.
on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # OCIR_REGION and OCIR_NAMESPACE are repository variables; OCIR_USERNAME
      # (tenancy-namespace/user) and OCIR_AUTH_TOKEN are secrets.
      - name: Log in to OCIR
        run: echo "${{ secrets.OCIR_AUTH_TOKEN }}" | docker login "${{ vars.OCIR_REGION }}.ocir.io" -u "${{ secrets.OCIR_USERNAME }}" --password-stdin

      # Version without the leading "v". The registry path stays out of git.
      - name: Build and push the release tag
        run: |
          IMAGE="${{ vars.OCIR_REGION }}.ocir.io/${{ vars.OCIR_NAMESPACE }}/dinner-roulette"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg COMMIT_SHA="$(git rev-parse --short=7 HEAD)" \
            -t "$IMAGE:${{ needs.release-please.outputs.version }}" --push .

      # KUBECONFIG_B64 is a repository secret and expires 24h after `make oke-up`.
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      # Same path as a local deploy. The tag is the release version, so the
      # manifest string changes and Kubernetes rolls the app out.
      - name: Deploy this version
        env:
          OCIR_IMAGE: ${{ vars.OCIR_REGION }}.ocir.io/${{ vars.OCIR_NAMESPACE }}/dinner-roulette:${{ needs.release-please.outputs.version }}
          OCIR_USERNAME: ${{ secrets.OCIR_USERNAME }}
          OCIR_AUTH_TOKEN: ${{ secrets.OCIR_AUTH_TOKEN }}
        run: make -C infra oke-deploy
