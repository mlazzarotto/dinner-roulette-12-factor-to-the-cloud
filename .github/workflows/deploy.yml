name: deploy

# Manual only: the cluster is down outside a workshop session.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # KUBECONFIG_B64 is a repository secret and expires 24h after `make oke-up`.
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      # Same path as a local deploy: the Makefile reads these from the environment
      # instead of infra/.secrets.env, which is not in the repo.
      - name: Deploy
        env:
          OCIR_IMAGE: ${{ vars.OCIR_REGION }}.ocir.io/${{ vars.OCIR_NAMESPACE }}/dinner-roulette:latest
          OCIR_USERNAME: ${{ secrets.OCIR_USERNAME }}
          OCIR_AUTH_TOKEN: ${{ secrets.OCIR_AUTH_TOKEN }}
        run: make -C infra oke-deploy
