name: pages

# Publishes the guide in docs/ to GitHub Pages. Pages must be enabled once by a repository
# admin: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - infra/**
      - .github/workflows/**
      - db/init.sql
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: pip install -r docs/requirements.txt

      # --strict fails on broken links and on embedded repository files that no longer exist.
      - run: mkdocs build --strict

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
